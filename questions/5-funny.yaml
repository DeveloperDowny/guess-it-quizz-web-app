  options:

  - "A luxury gaming setup"
  - "A suspiciously expensive vacation"
  - "A giant smart home nobody asked for"
  - "A café because apparently we're entrepreneurs now"

- id: 5
  question: "What is the most accurate way to describe your partner after knowing them for a while?"
