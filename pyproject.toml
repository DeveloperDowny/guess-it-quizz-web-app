[project]
name = "quizz-web-app"
version = "0.1.0"
description = "Browser-based quiz platform backed by the existing quiz engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "impersonation-quizz>=0.1.0",
  "quizz",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
